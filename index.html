<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Avax Staking</title>
  <meta name="description" content="Avax Staking lets you stake AVAX and earn staking rewards from your own wallet.">
  <link rel="canonical" href="https://avax-staking.github.io/">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <meta name="theme-color" content="#F7F4F2">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Avax Staking">
  <meta property="og:description" content="Avax Staking lets you stake AVAX and earn staking rewards from your own wallet.">
  <meta property="og:url" content="https://avax-staking.github.io/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Avax Staking">
  <meta name="twitter:description" content="Avax Staking lets you stake AVAX and earn staking rewards from your own wallet.">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="style.css">

  <link rel="prefetch" href="dashboard/">
  <link rel="prerender" href="dashboard/">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="Avax Staking home">
      <img src="favicon.png" width="28" height="28" alt="">
      <span>Avax Staking</span>
    </a>
    <nav class="nav" aria-label="Trusted references">
      <a href="https://snowtrace.io/" target="_blank" rel="nofollow noopener noreferrer">Snowtrace</a>
      <a href="https://www.avax.network/build/validators" target="_blank" rel="nofollow noopener noreferrer">Validators</a>
      <a href="https://defillama.com/chain/avalanche" target="_blank" rel="nofollow noopener noreferrer">DeFiLlama</a>
    </nav>
    <span class="spacer"></span>
    <a class="ghost" href="dashboard/" rel="noopener noreferrer">Open app</a>
  </header>

  <main class="stage">
    <section class="hero" aria-labelledby="page-title">
      <h1 id="page-title">Avax Staking</h1>
      <p class="sub"><strong>Avax Staking</strong> lets you stake AVAX and earn staking rewards from your own wallet.</p>
    </section>

    <section class="card" aria-label="Staking route">
      <div class="route">
        <div class="leg">
          <span class="label">Stake</span>
          <span class="chip">
            <img class="icon" src="avax.png" width="28" height="28" alt="AVAX">
            <span class="token">AVAX</span>
          </span>
        </div>
        <button class="switch" type="button" data-switch aria-label="Switch staking route">
          <span aria-hidden="true">&#8594;</span>
        </button>
        <div class="leg">
          <span class="label">Receive</span>
          <span class="chip">
            <img class="icon" src="savax.png" width="28" height="28" alt="sAVAX">
            <span class="token">sAVAX</span>
          </span>
        </div>
      </div>
      <a class="cta" href="dashboard/" rel="noopener noreferrer">Enter App <span aria-hidden="true">&#8250;</span></a>
    </section>
  </main>

  <footer class="foot">Avax Staking &mdash; 2026</footer>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://avalanche-ecosystem.github.io/#website",
        "url": "https://avalanche-ecosystem.github.io/",
        "name": "Avax Staking",
        "inLanguage": "en"
      },
      {
        "@type": "Organization",
        "@id": "https://avalanche-ecosystem.github.io/#organization",
        "name": "Avax Staking",
        "url": "https://avalanche-ecosystem.github.io/",
        "logo": "https://avalanche-ecosystem.github.io/favicon.png"
      },
      {
        "@type": "WebApplication",
        "@id": "https://avalanche-ecosystem.github.io/#app",
        "name": "Avax Staking",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "url": "https://avalanche-ecosystem.github.io/",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    ]
  }
  </script>

  <script>
  (function(){
    "use strict";
    var button = document.querySelector("[data-switch]");
    if (!button) return;
    button.addEventListener("click", function(){
      var chips = document.querySelectorAll(".leg .chip");
      var labels = document.querySelectorAll(".leg .label");
      if (chips.length < 2 || labels.length < 2) return;
      var chip = chips[0].innerHTML;
      chips[0].innerHTML = chips[1].innerHTML;
      chips[1].innerHTML = chip;
      var label = labels[0].textContent;
      labels[0].textContent = labels[1].textContent;
      labels[1].textContent = label;
    });
  })();
  </script>
</body>
</html>
